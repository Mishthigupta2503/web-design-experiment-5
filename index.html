<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #eaf4f4;
            color: #222;
            min-height: 100vh;
        }

        header {
            background-color: #243b55;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            text-align: center;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #cityInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        #searchButton {
            padding: 12px 20px;
            background-color: #243b55;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #searchButton:hover {
            background-color: #141e30;
        }

        #weatherResult {
            padding: 20px;
            background-color: #f4f7fb;
            border-radius: 8px;
            min-height: 100px;
        }

        #weatherResult h2 {
            color: #243b55;
            margin-bottom: 10px;
        }

        #weatherResult p {
            margin: 8px 0;
        }

        footer {
            margin-top: 30px;
            color: #555;
        }
    </style>
</head>

<body>

    <header>
        <h1>Weather App</h1>
        <p>Check the current weather of any city</p>
    </header>

    <main class="container">

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button id="searchButton">Search</button>
        </div>

        <div id="weatherResult">
            <p>Enter a city to view its weather.</p>
        </div>

        <footer>
            <p>Web Designing Lab | Experiment 5</p>
        </footer>

    </main>

    <script>

        const apiKey = "95025fcf123e0953f9a3e22b19be2059";

        const cityInput = document.getElementById("cityInput");
        const searchButton = document.getElementById("searchButton");
        const weatherResult = document.getElementById("weatherResult");

        searchButton.addEventListener("click", getWeather);

        async function getWeather() {

            const city = cityInput.value.trim();

            if (city === "") {
                weatherResult.innerHTML =
                    "<p>Please enter a city name.</p>";
                return;
            }

            weatherResult.innerHTML =
                "<p>Loading weather information...</p>";

            const url =
                `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric`;

            try {

                const response = await fetch(url);

                if (!response.ok) {
                     const errorData = await response.json();
                     throw new Error(errorData.message || "Weather data could not be fetched");
                    }

                const data = await response.json();

                weatherResult.innerHTML = `
                    <h2>${data.name}</h2>
                    <p><strong>Temperature:</strong> ${data.main.temp} °C</p>
                    <p><strong>Feels Like:</strong> ${data.main.feels_like} °C</p>
                    <p><strong>Weather:</strong> ${data.weather[0].description}</p>
                    <p><strong>Humidity:</strong> ${data.main.humidity}%</p>
                    <p><strong>Wind Speed:</strong> ${data.wind.speed} m/s</p>
                `;

            } catch (error) {

                weatherResult.innerHTML =
                    `<p>Error: ${error.message}</p>`;
            }
        }

    </script>

</body>
</html>
